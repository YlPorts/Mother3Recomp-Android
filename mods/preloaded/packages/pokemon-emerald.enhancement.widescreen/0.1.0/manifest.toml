format_version = 1
id = "pokemon-emerald.enhancement.widescreen"
version = "0.1.0"
name = "Emerald Widescreen Experiment"
author = "mstan"
description = "Reveal more overworld scenery and live NPCs at the original pixel scale. Experimental: distant objects outside the game's loaded area and special effects are not expanded."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "pokemon-emerald-us"
rom_sha1 = "f3ae088181bf583e55daf962a92bb46f4f1d07b7"

[[feature]]
id = "widescreen"
name = "Overworld Widescreen (Experimental)"
description = "Expand overworld scenery and live NPC visibility. Battles, transitions and unsupported screens stay centered."
group = "Presentation"
default_enabled = false

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
description = "Fit follows the window from native 3:2 through 32:9. Fixed modes keep their chosen aspect ratio."
type = "choice"
default = "fit"

[[option.choice]]
value = "fit"
label = "Fit to window"
[[option.choice]]
value = "16:9"
label = "16:9"
[[option.choice]]
value = "21:9"
label = "21:9"
[[option.choice]]
value = "32:9"
label = "32:9"

[[plugin]]
feature = "widescreen"
id = "pokemon-emerald.widescreen"
