name: Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/android.yml"
  push:
    branches: [android-port]
    paths:
      - "android/**"
      - "src/**"
      - "variants/**"
      - "gbarecomp"
      - "recomp-ui"
      - "CMakeLists.txt"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      variant:
        description: "MOTHER 3 variant"
        required: true
        default: "en"
        type: choice
        options:
          - en
          - jpn

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOTHER3_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.variant || 'en' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout required submodules
        shell: bash
        run: |
          git submodule update --init --depth=1 gbarecomp recomp-ui
          git -C gbarecomp config submodule.external/arm-recomp-core.url \
            https://github.com/mstan/arm-recomp-core.git
          git -C gbarecomp submodule update --init --depth=1 \
            external/arm-recomp-core platform/android/third_party/SDL
          # We use the repository-level Gradle install, not SDL's sample
          # project's wrapper. Removing it avoids validating an unused jar.
          rm -f gbarecomp/platform/android/third_party/SDL/android-project/gradle/wrapper/gradle-wrapper.jar

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android native toolchain
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          validate-wrappers: false

      - name: Build ARM64 debug APK
        working-directory: android
        run: |
          gradle :app:assembleDebug \
            -Pmother3Variant="${MOTHER3_VARIANT}" \
            -PgbaAbis=arm64-v8a \
            -PgbaNativeJobs=2 \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/Mother3Recomp-${MOTHER3_VARIANT}-android-arm64-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mother3Recomp-${{ env.MOTHER3_VARIANT }}-android-arm64
          path: out/*.apk
          if-no-files-found: error
